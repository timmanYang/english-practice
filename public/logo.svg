<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE8E8"/>
      <stop offset="50%" style="stop-color:#FFF3E0"/>
      <stop offset="100%" style="stop-color:#DCFCE7"/>
    </linearGradient>
    <!-- Frog body gradient -->
    <radialGradient id="frogBody" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#7DD37D"/>
      <stop offset="100%" style="stop-color:#4CAF50"/>
    </radialGradient>
    <!-- Frog belly -->
    <radialGradient id="frogBelly" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#C8E6C9"/>
      <stop offset="100%" style="stop-color:#A5D6A7"/>
    </radialGradient>
    <!-- Book spine shadow -->
    <linearGradient id="bookShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgba(0,0,0,0.08)"/>
      <stop offset="50%" style="stop-color:rgba(0,0,0,0)"/>
      <stop offset="100%" style="stop-color:rgba(0,0,0,0.08)"/>
    </linearGradient>
    <!-- Sparkle -->
    <radialGradient id="sparkle">
      <stop offset="0%" style="stop-color:#FFD93D;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FFD93D;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Outer circle background -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" stroke="none"/>

  <!-- Decorative sparkles -->
  <circle cx="100" cy="120" r="12" fill="url(#sparkle)" opacity="0.6"/>
  <circle cx="420" cy="140" r="8" fill="url(#sparkle)" opacity="0.5"/>
  <circle cx="380" cy="400" r="10" fill="url(#sparkle)" opacity="0.4"/>
  <circle cx="140" cy="380" r="7" fill="url(#sparkle)" opacity="0.5"/>

  <!-- Small decorative dots -->
  <circle cx="80" cy="200" r="4" fill="#FF6B6B" opacity="0.3"/>
  <circle cx="440" cy="250" r="4" fill="#60A5FA" opacity="0.3"/>
  <circle cx="200" cy="80" r="5" fill="#34D399" opacity="0.3"/>

  <!-- ===== OPEN BOOK ===== -->
  <!-- Book left page -->
  <path d="M256 340 Q200 320 140 340 L140 200 Q200 180 256 200 Z"
        fill="#FFFFFF" stroke="#E0E0E0" stroke-width="2"/>
  <!-- Book right page -->
  <path d="M256 340 Q312 320 372 340 L372 200 Q312 180 256 200 Z"
        fill="#FFFFFF" stroke="#E0E0E0" stroke-width="2"/>
  <!-- Book spine shadow -->
  <path d="M256 340 Q200 320 140 340 L140 200 Q200 180 256 200 Z"
        fill="url(#bookShadow)" opacity="0.5"/>
  <!-- Book center fold -->
  <line x1="256" y1="200" x2="256" y2="340" stroke="#E8E8E8" stroke-width="3"/>

  <!-- Left page text lines -->
  <line x1="170" y1="230" x2="230" y2="225" stroke="#E8E8E8" stroke-width="3" stroke-linecap="round"/>
  <line x1="168" y1="255" x2="232" y2="250" stroke="#E8E8E8" stroke-width="3" stroke-linecap="round"/>
  <line x1="166" y1="280" x2="234" y2="275" stroke="#E8E8E8" stroke-width="3" stroke-linecap="round"/>
  <line x1="164" y1="305" x2="220" y2="300" stroke="#E8E8E8" stroke-width="3" stroke-linecap="round"/>

  <!-- Right page text lines -->
  <line x1="282" y1="225" x2="342" y2="230" stroke="#E8E8E8" stroke-width="3" stroke-linecap="round"/>
  <line x1="280" y1="250" x2="344" y2="255" stroke="#E8E8E8" stroke-width="3" stroke-linecap="round"/>
  <line x1="278" y1="275" x2="346" y2="280" stroke="#E8E8E8" stroke-width="3" stroke-linecap="round"/>
  <line x1="280" y1="300" x2="330" y2="305" stroke="#E8E8E8" stroke-width="3" stroke-linecap="round"/>

  <!-- Right page colored highlight (learning emphasis) -->
  <rect x="285" y="245" width="45" height="8" rx="4" fill="#FF6B6B" opacity="0.15"/>

  <!-- ===== FROG ===== -->
  <!-- Frog body -->
  <ellipse cx="256" cy="230" rx="52" ry="48" fill="url(#frogBody)"/>

  <!-- Frog belly -->
  <ellipse cx="256" cy="245" rx="32" ry="28" fill="url(#frogBelly)"/>

  <!-- Frog feet - left -->
  <ellipse cx="210" cy="275" rx="20" ry="10" fill="#4CAF50" transform="rotate(-20, 210, 275)"/>
  <ellipse cx="205" cy="278" rx="5" ry="3" fill="#388E3C" transform="rotate(-20, 205, 278)"/>
  <ellipse cx="215" cy="280" rx="5" ry="3" fill="#388E3C" transform="rotate(-20, 215, 280)"/>
  <ellipse cx="222" cy="278" rx="5" ry="3" fill="#388E3C" transform="rotate(-20, 222, 278)"/>

  <!-- Frog feet - right -->
  <ellipse cx="302" cy="275" rx="20" ry="10" fill="#4CAF50" transform="rotate(20, 302, 275)"/>
  <ellipse cx="298" cy="278" rx="5" ry="3" fill="#388E3C" transform="rotate(20, 298, 278)"/>
  <ellipse cx="308" cy="280" rx="5" ry="3" fill="#388E3C" transform="rotate(20, 308, 280)"/>
  <ellipse cx="315" cy="278" rx="5" ry="3" fill="#388E3C" transform="rotate(20, 315, 278)"/>

  <!-- Frog eyes - left -->
  <circle cx="232" cy="195" r="18" fill="#4CAF50"/>
  <circle cx="232" cy="193" r="14" fill="#66BB6A"/>
  <circle cx="236" cy="190" r="9" fill="white"/>
  <circle cx="238" cy="189" r="5" fill="#2E7D32"/>
  <circle cx="240" cy="187" r="2" fill="white"/>

  <!-- Frog eyes - right -->
  <circle cx="280" cy="195" r="18" fill="#4CAF50"/>
  <circle cx="280" cy="193" r="14" fill="#66BB6A"/>
  <circle cx="284" cy="190" r="9" fill="white"/>
  <circle cx="286" cy="189" r="5" fill="#2E7D32"/>
  <circle cx="288" cy="187" r="2" fill="white"/>

  <!-- Frog smile -->
  <path d="M240 220 Q256 235 272 220" stroke="#2E7D32" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Frog cheeks (blush) -->
  <ellipse cx="218" cy="222" rx="10" ry="6" fill="#FF6B6B" opacity="0.25"/>
  <ellipse cx="294" cy="222" rx="10" ry="6" fill="#FF6B6B" opacity="0.25"/>

  <!-- ===== LETTERS ON BOOK ===== -->
  <!-- ABC letters floating from book -->
  <text x="155" y="185" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FF6B6B" opacity="0.7" transform="rotate(-15, 155, 185)">A</text>
  <text x="200" y="170" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#60A5FA" opacity="0.6" transform="rotate(5, 200, 170)">B</text>
  <text x="310" y="172" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#34D399" opacity="0.65" transform="rotate(-8, 310, 172)">C</text>
  <text x="355" y="188" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFD93D" opacity="0.7" transform="rotate(12, 355, 188)">1</text>

  <!-- Small star decorations -->
  <polygon points="130,160 133,168 141,168 135,173 137,181 130,176 123,181 125,173 119,168 127,168" fill="#FFD93D" opacity="0.5"/>
  <polygon points="380,155 383,163 391,163 385,168 387,176 380,171 373,176 375,168 369,163 377,163" fill="#FF6B6B" opacity="0.4"/>
</svg>
